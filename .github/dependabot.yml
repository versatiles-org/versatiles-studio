version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    versioning-strategy: increase-if-necessary
    ignore:
      # svelte-check 4.7.6 peers on `^5.0.0 || ^6.0.0`, so a TypeScript 7 bump breaks `npm ci`
      # outright. Drop this once svelte-check accepts 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      action:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']

  # Without this, GitHub still raises Rust advisories but Dependabot never opens a PR for them.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # glib is pinned at 0.18 by gtk 0.18, which Tauri v2 needs because it targets GTK3 via
      # webkit2gtk-4.1. The advisory is fixed in glib 0.20 — the GTK4 line — so there is nothing to
      # resolve to, and Dependabot fails the run with `security_update_not_possible` every time.
      # A permanently red job teaches people to ignore red jobs. Remove when Tauri moves to GTK4.
      - dependency-name: glib
