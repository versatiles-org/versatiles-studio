version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    versioning-strategy: increase-if-necessary
    ignore:
      # svelte-check 4.7.6 peers on `^5.0.0 || ^6.0.0`, so a TypeScript 7 bump breaks `npm ci`
      # outright. Drop this once svelte-check accepts 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      action:
        patterns: ['*']

  # Without this, GitHub still raises Rust advisories but Dependabot never opens a PR for them.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ['*']
