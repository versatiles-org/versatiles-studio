name: CodeQL

# **Advanced setup, so `codeql-config.yml` is read at all.** Default setup takes no configuration:
# it cannot ignore a path or a query, which leaves closing alerts by hand as the only lever. That
# does not scale, and a list nobody can finish reading is a list nobody reads.
#
# Enabling this requires default setup to be turned off first — the two conflict, and GitHub refuses
# the run rather than merging them. That is a repository setting, not a file.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published query reaches the default branch without waiting for a commit.
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      # Private repositories need this to read the Actions metadata; harmless on a public one.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # **No `ruby`.** Default setup detected it from `packaging/versatiles-studio.rb`, which is a
        # Homebrew cask — a template for a different repository, never executed here, and 40 lines
        # of declarations. Scanning it can only produce findings about code that does not run.
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      # Rust needs the crate to build. The rest are analysed from source.
      - name: Install Tauri system dependencies
        if: matrix.language == 'rust'
        timeout-minutes: 12
        uses: ./.github/actions/tauri-deps
      - uses: Swatinem/rust-cache@v2
        if: matrix.language == 'rust'
        with:
          key: codeql
          cache-on-failure: true

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
