name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a bundle can be asked for on a branch, on the rare occasion that is the question.
  workflow_dispatch:

# Least privilege, applied at the workflow level so every job inherits it. Nothing here writes:
# the jobs check out, build and test. The GITHUB_TOKEN passed to `assets:check` only lifts the
# unauthenticated GitHub API rate limit, which needs no extra scope.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # GitHub's default is six hours. These jobs take 30 seconds, two minutes and six to sixteen
    # minutes; anything near these caps is stuck rather than slow, and should say so while someone
    # is still watching.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Run granularly rather than through `npm run check`, so a failure names which check failed
      # without reading the log. `npm run check` is the single command for a human before a commit,
      # and includes the Rust half that the job below owns.
      - run: npm run check:format
      - run: npm run check:types
      - run: npm run check:lint
      # `check:test` runs vitest with coverage, so the report below is a by-product of the tests
      # that already had to run rather than a second pass over the same code.
      - run: npm run check:test
      - name: Upload coverage
        # A fork's pull request has no access to the secret, and failing someone's first
        # contribution on a missing token is the worst possible first impression.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: typescript
          # Named explicitly rather than searched for: `disable_search` is what stops the action
          # finding a stray report and uploading the wrong numbers under this flag.
          disable_search: true
          fail_ci_if_error: true
      - run: npm run build
      # Fails when an upstream release moves past a pin, or when a pinned digest changes under an
      # unchanged tag. Metadata-only, so it costs nothing (Q9).
      - run: npm run assets:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Tauri needs WebKitGTK to build on Linux, even for `cargo test` of the shell crate.
      #
      # `libappindicator3-dev` used to be here and is not needed: it is the Tauri *v1* package — v2
      # calls it `libayatana-appindicator3-dev` — and it is only wanted for a tray icon, which this
      # application does not have and does not compile in (`tauri` is taken with no features).
      - name: Install Tauri system dependencies
        # A backstop only — the real bound is inside the action, because a `uses:` step's timeout
        # is not reliably enforced.
        timeout-minutes: 12
        uses: ./.github/actions/tauri-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          # `llvm-tools-preview` is what `cargo llvm-cov` reads the counters with.
          components: rustfmt, clippy, llvm-tools-preview
      # A prebuilt binary. Building it from source here would cost more than the coverage run.
      - uses: taiki-e/install-action@cargo-llvm-cov
      # **Save the cache even when the job fails.** The action does not by default, so a run that
      # dies at clippy or at a test throws away every dependency it just compiled — and the next
      # push, usually the fix for that same failure, compiles them all again. A red build is exactly
      # when the wait is most expensive, because it is the one you are iterating on.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The bundled tier is gitignored, so fetch it or the archive-serving test skips itself.
      - run: npm ci
      - run: npm run assets:fetch
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # **Coverage instead of a plain `cargo test`, not as well as.** `cargo llvm-cov` runs the same
      # tests; a separate coverage job would build GDAL from source a second time, which is most of
      # this job's wall clock (Q19, Q20).
      #
      # Not `--summary-only`: that writes an lcov with per-file totals and no per-line records, so
      # Codecov has nothing to colour a diff with — the patch status would be empty and nobody would
      # know why.
      #
      # The core carries the logic and has no Tauri types, so it tests without a display server.
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust
          disable_search: true
          fail_ci_if_error: true

  bundle:
    name: Bundle (${{ matrix.os }})
    # **Not on pull requests.** Bundling is six minutes a platform on a warm cache and fifteen on a
    # cold one, which is the whole critical path: `Frontend` answers in 30s and `Rust` in about two
    # minutes, and both already prove the code compiles. What a bundle proves on top of that is that
    # *packaging* works on both release-1 targets ([Q10](../../docs/decisions.md)) — a question worth
    # asking of what lands on `main`, and of a release, rather than of every commit on the way there.
    #
    # Reachable on demand: `workflow_dispatch` runs it against any branch when packaging is the thing
    # being changed.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Six minutes warm, about sixteen when the cache misses and GDAL is rebuilt from source.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 12
        uses: ./.github/actions/tauri-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.os }}
          # A bundle that fails part-way has still built GDAL from source, which is most of its
          # fifteen minutes. Keeping that is worth more here than anywhere else in this workflow.
          cache-on-failure: true
      - run: npm ci
      - run: npm run assets:fetch
      # Proves the app actually bundles on both release-1 targets (Q10). Ad-hoc signing on macOS is
      # not optional — on Apple Silicon a binary needs at least that to execute.
      - run: npx tauri build --ci
