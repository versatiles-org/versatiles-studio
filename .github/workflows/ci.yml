name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, applied at the workflow level so every job inherits it. Nothing here writes:
# the jobs check out, build and test. The GITHUB_TOKEN passed to `assets:check` only lifts the
# unauthenticated GitHub API rate limit, which needs no extra scope.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Fails when an upstream release moves past a pin, or when a pinned digest changes under an
      # unchanged tag. Metadata-only, so it costs nothing (Q9).
      - run: npm run assets:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Tauri needs WebKitGTK to build on Linux, even for `cargo test` of the shell crate.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The bundled tier is gitignored, so fetch it or the archive-serving test skips itself.
      - run: npm ci
      - run: npm run assets:fetch
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The core carries the logic and has no Tauri types, so it tests without a display server.
      - run: cargo test --workspace

  bundle:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.os }}
      - run: npm ci
      - run: npm run assets:fetch
      # Proves the app actually bundles on both release-1 targets (Q10). Ad-hoc signing on macOS is
      # not optional — on Apple Silicon a binary needs at least that to execute.
      - run: npx tauri build --ci
