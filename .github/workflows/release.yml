name: Release

# Builds the installers for release 1's targets and attaches them to a **draft** release
# ([Q10](../../docs/decisions.md), S5.6, S5.7).
#
# **Draft, always.** Publishing is a person's decision: it is what sends the auto-updater to every
# installed copy, and what a Homebrew cask is bumped against. The workflow produces the artefacts and
# stops; someone reads the notes and presses the button.
#
# **Not Windows.** Q10 defers it with the Apple Developer identity — both are procurement, not code.
# Nothing here is Windows-shaped, so adding it later is a matrix row and a certificate.

on:
  push:
    tags: ['v*']
  # A dry run: builds every target and uploads the results as workflow artefacts, creating no
  # release. This is how a packaging change is tested without spending a version number.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------------------------
  # What is being released
  # -------------------------------------------------------------------------------------------
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # **The tag follows the files, not the other way round.** Rewriting the version into
      # `tauri.conf.json` here would make the tag the source of truth and leave the repository
      # disagreeing with what shipped; checking makes a mismatch a failure ten seconds in, rather
      # than three installers named 0.0.0 forty minutes later.
      #
      # That the three files agree with *each other* is `npm run check:test`'s business, so it is
      # already true by the time a tag exists.
      - id: read
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "package.json says $version"

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag v$tag does not match version $version — bump the version files, or retag" >&2
              exit 1
            fi
          fi

  # -------------------------------------------------------------------------------------------
  # The installers
  # -------------------------------------------------------------------------------------------
  bundle:
    name: ${{ matrix.label }}
    needs: version
    strategy:
      # Every target is worth having on its own; one failing platform must not cancel the others,
      # because the usual cause is that platform.
      fail-fast: false
      matrix:
        include:
          # `.deb` **and** an AppImage: a `.deb` is built against one WebKitGTK version and may not
          # install across distributions, which is exactly what the AppImage is for (Q10).
          - label: Linux (x86_64)
            runner: ubuntu-latest
            artefact: linux-x86_64
            platform: linux-x86_64
          # A desktop GUI on ARM Linux is a smaller audience than a CLI on ARM Linux — a Raspberry
          # Pi or Asahi, rather than every cloud instance — but the runner is free and the smoke
          # test on it is the only way this target is ever exercised.
          - label: Linux (arm64)
            runner: ubuntu-24.04-arm
            artefact: linux-aarch64
            platform: linux-aarch64
          # Two Macs rather than a universal binary. `lipo` would mean building GDAL from source
          # twice and joining the results, and a Homebrew cask names one URL and one checksum per
          # architecture anyway — so two files is the shape the consumer already wants.
          - label: macOS (Apple Silicon)
            runner: macos-latest
            artefact: macos-aarch64
            platform: darwin-aarch64
          - label: macOS (Intel)
            runner: macos-26-intel
            artefact: macos-x86_64
            platform: darwin-x86_64
    runs-on: ${{ matrix.runner }}
    # A cold cache rebuilds GDAL from source, which is most of the time here (Q19, Q20).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 12
        uses: ./.github/actions/tauri-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.artefact }}
          cache-on-failure: true
      - run: npm ci
      # The bundled tier is gitignored and is what makes the app work offline from first launch
      # (Q9). Without it the installer ships a map with no labels and no icons.
      - run: npm run assets:fetch

      # Ad-hoc signing is not optional on Apple Silicon — a binary needs at least that to execute —
      # and it is what `--ci` arranges when no identity is configured. A real Developer ID is
      # deferred with Windows (Q10), which is why the install instructions cover Gatekeeper.
      # `createUpdaterArtifacts` in `tauri.conf.json` is what makes this also emit a signed
      # `.tar.gz`/`.AppImage.tar.gz` and a `.sig` beside each installer (G4, S5.8). The private key
      # never leaves the secret store; the public half is compiled into the app, which is what makes
      # a compromised release page unable to install anything we did not sign.
      # **`--bundles` is deliberately not passed.** `tauri.conf.json` already lists exactly the four
      # targets release 1 wants and Tauri filters them by platform, so restricting the list here
      # would only be a second place to keep in step.
      #
      # It would also be wrong. Restricting it *drops the updater artefact*: measured on macOS,
      # `--bundles dmg` produces the `.dmg` and no `.app.tar.gz`, and does not even attempt to sign.
      # `latest-json.ts` only refuses when *no* platform has one, so a release would have published a
      # manifest with the Linux entry alone — and every Mac would simply never see an update, with
      # nothing anywhere saying so.
      - name: Bundle
        run: npm run bundle -- --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # **Does the thing we just built actually run?** "An installer was produced" and "the binary
      # starts" are different claims: GDAL is linked statically and WebKit dynamically, so a bundle
      # can be well-formed and unlaunchable. `--version` answers without a window, which is the only
      # way to ask on a runner with no display.
      #
      # It also checks the bundled tier is inside the bundle. Without `sprites.tar.gz` and
      # `glyphs.tar.gz` the map renders with no labels and no icons (Q9) — a failure that looks like
      # a styling bug to whoever hits it, and is invisible to every other check here.
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ needs.version.outputs.version }}"

          if [ "$RUNNER_OS" = "macOS" ]; then
            app="target/release/bundle/macos/VersaTiles Studio.app"
            binary="$app/Contents/MacOS/versatiles-studio"
            resources="$app/Contents/Resources/resources"
          else
            binary="target/release/versatiles-studio"
            resources="target/release/resources"
          fi

          got="$("$binary" --version)"
          echo "  $got"
          [ "$got" = "versatiles-studio $expected" ] || {
            echo "::error::the bundled binary reports \"$got\", not \"versatiles-studio $expected\"" >&2
            exit 1
          }

          for asset in sprites.tar.gz glyphs.tar.gz; do
            [ -f "$resources/$asset" ] || {
              echo "::error::$asset is missing from the bundle — the map would have no labels" >&2
              exit 1
            }
          done
          echo "  the bundled tier is present"

      # Named for the platform rather than left as Tauri's nested `bundle/<kind>/` tree, so the
      # release job can attach everything it downloads without knowing which runner made it.
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p upload

          # `target/` at the workspace root, not `src-tauri/target/`: the two crates share one
          # target directory, and `tauri build` writes the bundle where cargo writes everything
          # else. The stale `src-tauri/target` predates the workspace.
          #
          # Installers keep the names Tauri gave them — they are what a person downloads, and they
          # already carry the version and the architecture.
          find target/release/bundle \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec cp {} upload/ \;

          # **The updater artefacts are renamed, and they have to be.** Tauri calls the macOS one
          # `VersaTiles Studio.app.tar.gz` — no version, no architecture — so both Mac runners
          # produce the same filename and the merged download would silently keep one of them.
          # Naming each after the platform key the updater looks it up by makes them unique and
          # turns `latest.json` into a lookup rather than a guess about arch spellings.
          while IFS= read -r file; do
            case "$file" in
              *.app.tar.gz)          cp "$file" "upload/${{ matrix.platform }}.app.tar.gz" ;;
              *.app.tar.gz.sig)      cp "$file" "upload/${{ matrix.platform }}.app.tar.gz.sig" ;;
              *.AppImage.tar.gz)     cp "$file" "upload/${{ matrix.platform }}.AppImage.tar.gz" ;;
              *.AppImage.tar.gz.sig) cp "$file" "upload/${{ matrix.platform }}.AppImage.tar.gz.sig" ;;
            esac
          done < <(find target/release/bundle \( -name '*.tar.gz' -o -name '*.tar.gz.sig' \))

          # An empty upload is a bundle that silently produced nothing, which would otherwise
          # surface as a release missing one platform and nobody noticing until an install failed.
          if [ -z "$(ls -A upload)" ]; then
            echo "::error::no installer was produced for ${{ matrix.artefact }}" >&2
            exit 1
          fi
          ls -lh upload

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artefact }}
          path: upload/*
          if-no-files-found: error

  # -------------------------------------------------------------------------------------------
  # The draft
  # -------------------------------------------------------------------------------------------
  release:
    name: Draft release
    # Only for a tag. `workflow_dispatch` stops at the artefacts above, which is the whole point of
    # being able to run this on a branch.
    if: github.event_name == 'push'
    needs: [version, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The one job that writes. Everything above inherits the workflow's read-only default.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/latest-json.ts
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - run: ls -lh installers

      # The manifest the updater reads. Built from what was actually produced rather than from a
      # template, so a platform whose build failed is absent from it — an updater that offers a
      # download that is not there is worse than one that offers nothing.
      #
      # `releases/latest/download/latest.json` resolves to the newest **published** release, so a
      # draft is invisible to every installed copy until someone presses publish. That is the same
      # property the draft gives the installers, applied to the thing that reaches people
      # automatically.
      # The notes were written by a person before the tag existed, and this is where they are read
      # rather than re-stated. Missing is not fatal: a release with the install instructions and no
      # notes is worse than one with both, and better than no release.
      - name: Read the notes
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="## v$version " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' \
              CHANGELOG.md >notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for v$version"
            : >notes.md
          fi
          cat notes.md

      - name: Build latest.json
        run: node --experimental-strip-types scripts/latest-json.ts installers ${{ needs.version.outputs.version }} > installers/latest.json
      - run: cat installers/latest.json

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: VersaTiles Studio ${{ needs.version.outputs.version }}
          files: installers/*
          # macOS is unsigned until Q10 is revisited, so every download from this page meets
          # Gatekeeper. Saying so on the page beats letting someone find out at first launch.
          # `body_path` is the notes; `append_body` puts the standing install text after them, so
          # what changed is the first thing on the page and the Gatekeeper warning is still on it.
          body_path: notes.md
          append_body: true
          body: |
            ## Install

            **Linux** — `.deb` for Debian and Ubuntu, or the AppImage anywhere else. A `.deb` is
            built against one WebKitGTK version and may not install across distributions; that is
            what the AppImage is for.

            **macOS** — download the `.dmg` for your Mac: `aarch64` for Apple Silicon, `x86_64` for
            Intel. **This build is not notarised**, so macOS will refuse it on first launch. Open
            **System Settings → Privacy & Security** and choose **Open Anyway**, or run:

            ```sh
            xattr -d com.apple.quarantine "/Applications/VersaTiles Studio.app"
            ```

            Windows is not built yet.
