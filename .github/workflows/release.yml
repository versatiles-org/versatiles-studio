name: Release

# Builds the installers for release 1's targets and attaches them to a **draft** release
# ([Q10](../../docs/decisions.md), S5.6, S5.7).
#
# **Drafted, verified, then published — in that order, in one run.** The draft exists only for the
# seconds between uploading the assets and checking them, because that check is what publishing is
# gated on: every URL in `latest.json` must name an asset that actually exists. A human reading the
# page was the old gate, and it stopped being one when the notes became generated rather than
# written — while leaving a hand-pushed tag to dead-end at a draft nobody was told about.
#
# The cost, stated plainly: a tag pushed by accident is a release within the hour. `git tag` is the
# deliberate act this relies on.
#
# **Not Windows.** Q10 defers it with the Apple Developer identity — both are procurement, not code.
# Nothing here is Windows-shaped, so adding it later is a matrix row and a certificate.

on:
  push:
    tags: ['v*']
  # A dry run: builds every target and uploads the results as workflow artefacts, creating no
  # release. This is how a packaging change is tested without spending a version number.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------------------------
  # What is being released
  # -------------------------------------------------------------------------------------------
  version:
    name: Version and draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Opens the draft, so the bundles below have somewhere to upload to.
      contents: write
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # **The tag follows the files, not the other way round.** Rewriting the version into
      # `tauri.conf.json` here would make the tag the source of truth and leave the repository
      # disagreeing with what shipped; checking makes a mismatch a failure ten seconds in, rather
      # than three installers named 0.0.0 forty minutes later.
      #
      # That the three files agree with *each other* is `npm run check:test`'s business, so it is
      # already true by the time a tag exists.
      - id: read
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "package.json says $version"

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag v$tag does not match version $version — bump the version files, or retag" >&2
              exit 1
            fi
          fi

      # **Every cheap precondition belongs in this job, which is the point of this job.** v0.2.0
      # spent five builds and about two hours of runner time before a `cat` of a file the checkout
      # had not fetched took the release down. Nothing below costs more than a second, and all of it
      # can fail before a single compiler starts.
      #
      # A `workflow_dispatch` run assembles the notes too and then stops. That is deliberate: it is
      # how a change to the notes gets tested without spending a version number.
      - name: Assemble the notes
        run: |
          set -euo pipefail
          version="${{ steps.read.outputs.version }}"

          awk -v v="## v$version " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' \
            CHANGELOG.md >notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for v$version" >&2
            exit 1
          fi

          # The standing text lives in a file rather than a heredoc: a heredoc inside a YAML block
          # keeps its indentation, and ten spaces in front of every line turns markdown into a code
          # block.
          printf '\n' >>notes.md
          cat .github/release-install.md >>notes.md

          cat notes.md

      # **Opened here, filled by the bundles, published at the end.** A draft is invisible to anyone
      # without push access and to `releases/latest/download`, so it reaches nobody until the last
      # job flips it — while giving each bundle somewhere to put its installers as it finishes, and
      # giving a re-run of one failed platform somewhere to put just that platform's.
      #
      # Idempotent because a re-run must land on the release that already exists rather than failing
      # on it. The body is rewritten each time so an edited CHANGELOG reaches the page on a re-run.
      - name: Open the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.read.outputs.version }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$tag is already published — retagging cannot rewrite a release people have" >&2
              exit 1
            fi
            echo "draft $tag already exists; updating its notes"
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" --draft \
              --title "VersaTiles Studio ${{ steps.read.outputs.version }}" \
              --notes-file notes.md
          fi

  # -------------------------------------------------------------------------------------------
  # The installers
  # -------------------------------------------------------------------------------------------
  bundle:
    name: ${{ matrix.label }}
    needs: version
    strategy:
      # Every target is worth having on its own; one failing platform must not cancel the others,
      # because the usual cause is that platform.
      fail-fast: false
      matrix:
        include:
          # `.deb` **and** an AppImage: a `.deb` is built against one WebKitGTK version and may not
          # install across distributions, which is exactly what the AppImage is for (Q10).
          - label: Linux arm
            runner: ubuntu-24.04-arm
            artefact: linux-aarch64
            platform: linux-aarch64
          - label: Linux x86
            runner: ubuntu-latest
            artefact: linux-x86_64
            platform: linux-x86_64
          # Two Macs rather than a universal binary. `lipo` would mean building GDAL from source
          # twice and joining the results, and a Homebrew cask names one URL and one checksum per
          # architecture anyway — so two files is the shape the consumer already wants.
          - label: macOS arm
            runner: macos-latest
            artefact: macos-aarch64
            platform: darwin-aarch64
          - label: macOS x86
            runner: macos-26-intel
            artefact: macos-x86_64
            platform: darwin-x86_64
          # Native, not cross-compiled: Studio compiles GDAL from source, and a cross-compiled
          # GDAL that nothing can run is not something to ship.
          #
          # **x86_64 only.** `gdal-sys` has no prebuilt bindings for `aarch64 + windows` and
          # generates none in a bundled build, so that target cannot be built at all from here
          # (S5.9). Windows on ARM runs this installer under emulation.
          - label: Windows x86
            runner: windows-latest
            artefact: windows-x86_64
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    # A cold cache rebuilds GDAL from source, which is most of the time here (Q19, Q20).
    timeout-minutes: 60
    permissions:
      # Each bundle uploads its own installers into the draft the job above opened, so the assets
      # arrive as they are built rather than waiting for the slowest platform and being copied twice.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 12
        uses: ./.github/actions/tauri-deps
      # PROJ generates `proj.db` with the sqlite3 *binary* during the build, and the Windows
      # images are the only ones without it.
      - name: Install sqlite3
        if: runner.os == 'Windows'
        uses: ./.github/actions/sqlite3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.artefact }}
          cache-on-failure: true
      - run: npm ci
      # The bundled tier is gitignored and is what makes the app work offline from first launch
      # (Q9). Without it the installer ships a map with no labels and no icons.
      - run: npm run assets:fetch

      # Ad-hoc signing is not optional on Apple Silicon — a binary needs at least that to execute —
      # and it is what `--ci` arranges when no identity is configured. A real Developer ID is
      # deferred with Windows (Q10), which is why the install instructions cover Gatekeeper.
      # `createUpdaterArtifacts` in `tauri.conf.json` is what makes this also emit a signed
      # `.tar.gz`/`.AppImage.tar.gz` and a `.sig` beside each installer (G4, S5.8). The private key
      # never leaves the secret store; the public half is compiled into the app, which is what makes
      # a compromised release page unable to install anything we did not sign.
      # **`--bundles` is deliberately not passed.** `tauri.conf.json` already lists exactly the four
      # targets release 1 wants and Tauri filters them by platform, so restricting the list here
      # would only be a second place to keep in step.
      #
      # It would also be wrong. Restricting it *drops the updater artefact*: measured on macOS,
      # `--bundles dmg` produces the `.dmg` and no `.app.tar.gz`, and does not even attempt to sign.
      # `latest-json.ts` only refuses when *no* platform has one, so a release would have published a
      # manifest with the Linux entry alone — and every Mac would simply never see an update, with
      # nothing anywhere saying so.
      - name: Bundle
        run: npm run bundle -- --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # **Does the thing we just built actually run?** "An installer was produced" and "the binary
      # starts" are different claims: GDAL is linked statically and WebKit dynamically, so a bundle
      # can be well-formed and unlaunchable. `--version` answers without a window, which is the only
      # way to ask on a runner with no display.
      #
      # It also checks the bundled tier is inside the bundle. Without `sprites.tar.gz` and
      # `glyphs.tar.gz` the map renders with no labels and no icons (Q9) — a failure that looks like
      # a styling bug to whoever hits it, and is invisible to every other check here.
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ needs.version.outputs.version }}"

          if [ "$RUNNER_OS" = "Windows" ]; then
            binary="target/release/versatiles-studio.exe"
            resources="target/release/resources"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            app="target/release/bundle/macos/VersaTiles Studio.app"
            binary="$app/Contents/MacOS/versatiles-studio"
            resources="$app/Contents/Resources/resources"
          else
            binary="target/release/versatiles-studio"
            resources="target/release/resources"
          fi

          got="$("$binary" --version)"
          echo "  $got"
          [ "$got" = "versatiles-studio $expected" ] || {
            echo "::error::the bundled binary reports \"$got\", not \"versatiles-studio $expected\"" >&2
            exit 1
          }

          for asset in sprites.tar.gz glyphs.tar.gz; do
            [ -f "$resources/$asset" ] || {
              echo "::error::$asset is missing from the bundle — the map would have no labels" >&2
              exit 1
            }
          done
          echo "  the bundled tier is present"

      # Named for the platform rather than left as Tauri's nested `bundle/<kind>/` tree, so the
      # release job can attach everything it downloads without knowing which runner made it.
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload

          # `target/` at the workspace root, not `src-tauri/target/`: the two crates share one
          # target directory, and `tauri build` writes the bundle where cargo writes everything else.
          #
          # `-maxdepth 2` matters. Under `bundle/` sit the *staging* directories the deb and the
          # AppImage were assembled from, holding the package's own `control.tar.gz` and `data.tar.gz`
          # and a copy of our `sprites.tar.gz` and `glyphs.tar.gz`. A recursive search swept all four
          # into the release.
          find target/release/bundle -maxdepth 2 \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' \) \
            -exec cp {} upload/ \;

          # **The updater artefacts differ by platform, and not the way the docs suggest.**
          #
          # macOS produces `VersaTiles Studio.app.tar.gz` — no version, no architecture — so both Mac
          # builds emit the same filename and the merged download would silently keep one. Renaming
          # each to its updater platform key makes them distinct and makes `latest.json` a lookup.
          #
          # Linux has no `.AppImage.tar.gz`; Tauri signs the AppImage itself. So the file the updater
          # downloads *is* the file a person downloads, and it needs no rename — its own name already
          # carries the architecture. Only the signature comes along.
          case "$RUNNER_OS" in
            macOS)
              find target/release/bundle -maxdepth 2 -name '*.app.tar.gz' \
                -exec cp {} "upload/${{ matrix.platform }}.app.tar.gz" \;
              find target/release/bundle -maxdepth 2 -name '*.app.tar.gz.sig' \
                -exec cp {} "upload/${{ matrix.platform }}.app.tar.gz.sig" \;
              ;;
            Linux)
              find target/release/bundle -maxdepth 2 -name '*.AppImage.sig' -exec cp {} upload/ \;
              ;;
            Windows)
              # **Whatever it produced.** The plugin's own documentation says the Windows updater
              # artefact is a `.zip` of the installer; its documentation also said Linux ships an
              # `.AppImage.tar.gz`, and Linux ships a bare `.AppImage`. So this takes the zip if
              # there is one and the signature either way, and `latest-json.ts` refuses anything it
              # cannot account for — by name, rather than by dropping the platform silently.
              find target/release/bundle -maxdepth 2 \
                \( -name '*-setup.exe.zip' -o -name '*-setup.exe.zip.sig' -o -name '*-setup.exe.sig' \) \
                -exec cp {} upload/ \;
              ;;
          esac

          # **No spaces in what we upload.** GitHub rewrites a space in an asset name to a dot, so
          # `VersaTiles Studio_0.1.0_amd64.AppImage` becomes `VersaTiles.Studio_…` on the release
          # while `latest.json` still points at the name we had — and every Linux update 404s. Naming
          # them ourselves means GitHub has nothing to rewrite, rather than us reimplementing its
          # rule and hoping a space is the only character it touches.
          for file in upload/*\ *; do
            [ -e "$file" ] || continue
            mv "$file" "${file// /-}"
          done

          # An empty upload is a bundle that silently produced nothing, which would otherwise
          # surface as a release missing one platform and nobody noticing until an install failed.
          if [ -z "$(ls -A upload)" ]; then
            echo "::error::no installer was produced for ${{ matrix.artefact }}" >&2
            exit 1
          fi
          ls -lh upload

      # **Straight into the draft, and `--clobber` because a re-run must replace rather than refuse.**
      # Uploading per platform is what makes one failed leg recoverable on its own: re-running this
      # job replaces its own assets and leaves the other four alone.
      #
      # Concurrent uploads are safe — each asset is its own API call, and nothing here reads and
      # rewrites the release object. Only the job above and the job below do that, and neither runs
      # while these do.
      - name: Upload into the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "v${{ needs.version.outputs.version }}" upload/* --clobber

      # The `workflow_dispatch` path has no release to upload to, which is the whole point of it.
      # The artefacts are how a packaging change is inspected without spending a version number.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'push'
        with:
          name: installers-${{ matrix.artefact }}
          path: upload/*
          if-no-files-found: error

  # -------------------------------------------------------------------------------------------
  # Publishing
  # -------------------------------------------------------------------------------------------
  publish:
    name: Verify and publish
    # Only for a tag. `workflow_dispatch` stops at the artefacts above, which is the whole point of
    # being able to run this on a branch.
    if: github.event_name == 'push'
    needs: [version, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      # **A full checkout, not a sparse one.** The sparse list here fetched two of the three files
      # this job read, and the third was missing for a whole release. Fetching this repository costs
      # a couple of seconds; naming paths correctly forever costs more than that eventually.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # **The names come from the release, the signatures from disk.** GitHub is the authority on
      # what an asset ended up being called — it rewrites characters it dislikes — so a manifest
      # built from anything else is a manifest of URLs that may not resolve. The `.sig` files are a
      # few hundred bytes each and are the one thing the manifest needs the *contents* of.
      - name: Collect what was uploaded
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort >names.txt
          echo "$(wc -l <names.txt) assets on the draft:"
          sed 's/^/  /' names.txt

          mkdir -p sigs
          gh release download "$TAG" --pattern '*.sig' --dir sigs
          echo "$(ls -1 sigs | wc -l) signatures downloaded"

      # Every guard in here reads the complete set at once: a platform with no signature, a
      # signature no platform claims, two files matching one suffix, a name GitHub would rewrite.
      # None of them can be checked one bundle at a time, which is why this is not in the matrix.
      - name: Build latest.json
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/latest-json.ts \
            sigs "${{ needs.version.outputs.version }}" names.txt >latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

      # **Does every URL in the manifest point at an asset that exists?**
      #
      # Both sides now come from the same API listing, so this can no longer catch a name GitHub
      # rewrote — `latest-json.ts` refuses those before they are ever uploaded. What it still catches
      # is an asset that never arrived: a bundle job that was skipped, cancelled, or re-run against
      # the wrong tag leaves the manifest naming a file the release does not have.
      - name: Verify the manifest
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort >uploaded.txt

          missing=0
          while IFS= read -r wanted; do
            if grep -qxF "$wanted" uploaded.txt; then
              echo "  ok       $wanted"
            else
              echo "::error::latest.json points at $wanted, which is not on the release"
              missing=1
            fi
          done < <(node -e '
            const m = require("./latest.json");
            for (const p of Object.values(m.platforms)) {
              console.log(decodeURIComponent(p.url.split("/").pop()));
            }
          ')
          exit "$missing"

      # **`--latest` is not decoration.** The updater fetches
      # `releases/latest/download/latest.json`, so a release that is published without being marked
      # latest reaches nobody: every installed copy keeps seeing the previous version, and nothing
      # anywhere reports an error.
      - name: Publish
        run: |
          gh release edit "$TAG" --draft=false --latest
          echo "published https://github.com/${{ github.repository }}/releases/tag/$TAG"

      # **The tap pulls; this only tells it to.** `bin/make_cask.sh` over there reads the release
      # that was just published and finds its assets by suffix, so a renamed `.dmg` cannot leave the
      # cask pointing at a file that no longer exists — which is what a hand-edited copy in this
      # repository kept doing while the naming was being settled.
      #
      # `PAT_TOKEN` because `github.token` is scoped to this repository and cannot start a workflow
      # in another. The same secret and the same call versatiles-rs already uses for its formula.
      - name: Update the Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: gh workflow run update_cask.yml --repo versatiles-org/homebrew-versatiles --ref main

  # -------------------------------------------------------------------------------------------
  # **Why a failed run leaves its draft behind.**
  #
  # An abandoned draft looks like litter, and deleting it was the obvious tidy-up — but it would
  # throw away the reason the draft is opened early. `fail-fast: false` means one broken platform
  # leaves the other four built and uploaded; re-running that one job then fills the gap in about
  # twenty minutes instead of rebuilding everything for two hours. Deleting the draft on failure
  # would turn every partial failure back into a full rebuild.
  #
  # The draft costs nothing while it waits: invisible without push access, invisible to
  # `releases/latest/download`, and reachable by no installed copy.
  #
  # A stale asset is the one risk — retag the same version onto a different commit and an asset
  # whose *name* changed is not replaced by `--clobber`, it is joined. `latest-json.ts` refuses that
  # loudly rather than shipping it: an orphan `.sig` no platform claims is an error, and two files
  # matching one platform's suffix is another. To start clean, `gh release delete "$TAG"` by hand.
