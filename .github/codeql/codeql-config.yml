# What the code scanner looks at, and what it is allowed to say.
#
# **This file only takes effect under advanced setup.** Default setup ignores it entirely, which is
# why the workflow beside it exists: there is no other way to filter paths or queries.
#
# The policy behind it, so the next person does not have to re-derive it from the alert list:
#
# **Paths a person chose are not a vulnerability.** Studio is a desktop application whose purpose is
# to open the file you point it at; it runs as you, and you could open the same file with any other
# program. `rust/path-injection` cannot tell that apart from a server taking a path off a request,
# so it flags every one — 65 alerts, two thirds of them in test code.
#
# **Paths built from data are.** A name inside `project.yaml`, an id arriving over IPC, an entry in a
# downloaded `.tar.gz` — those were written by whoever produced the data. Those go through
# `studio_core::paths`, which is one module with tests, and that is the control that replaces
# reading 65 alerts by hand.
#
# **The rule stays on.** It is noisy, and on 2026-08-22 it was also right twice: an unvalidated font
# id that deleted files outside the asset directory, and a zip slip in the style bundle. Turning it
# off would have bought a quiet list and kept both bugs.

name: VersaTiles Studio

paths-ignore:
  # Scratch directories for the crate's own tests — every path in it is one the test just made up.
  # The `#[cfg(test)]` modules inside product files cannot be excluded this way, which is most of
  # the remaining noise; see the note in the workflow about what to try next.
  - crates/studio-core/src/testing.rs

# **`scripts/` is deliberately not excluded**, though it is developer tooling that never runs on
# anyone else's input. The allow-list in `update-assets.ts` — the one that stops a tampered manifest
# redirecting a CI download — exists because this scanner flagged a request forgery there. A category
# that has already earned its keep once is not one to switch off.
