[package]
name = "versatiles-studio"
# **This is user-facing.** It becomes `Comment=` in the Linux desktop entry, which is the
# sentence shown under the name in an application menu - so it says what the application is
# for, not how the crate is arranged. The architecture note it used to hold is in the module
# documentation in `lib.rs`, where its readers are.
description = "Open, inspect and build map tiles - pipelines, styles and conversion, without a terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "versatiles_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
specta-typescript = "0.0.12"
specta-serde = "0.0.12"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
# **A WebDriver server compiled into the binary, for end-to-end tests** - never in a shipped build.
#
# The embedded provider is the only one that can drive a WKWebView, which is what lets the same
# tests run on a developer's Mac and on a Linux runner rather than only the second. The price is a
# remote-control server inside the application, so it is opt-in and off by default: an auditable,
# no-telemetry desktop tool must not ship one by accident. `guards.test.ts` asserts that it is
# absent from `default` and from every command that builds a release.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
studio-core = { path = "../crates/studio-core", features = ["bindings"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8.3"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }

[lints.clippy]
all = "warn"
