[package]
name = "studio-core"
description = "VersaTiles Studio core — project model, jobs, analysis, assets, server. No Tauri types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
tokio.workspace = true
versatiles.workspace = true
versatiles_container.workspace = true
versatiles_core.workspace = true

[lints.clippy]
all = "warn"

[dev-dependencies]
# Already in the tree via the server feature; used to prove the data plane actually serves.
reqwest = { version = "0.13", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
