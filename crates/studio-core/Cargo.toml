[package]
name = "studio-core"
description = "VersaTiles Studio core — project model, jobs, analysis, assets, server. No Tauri types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
# Not called directly — present so the static GDAL and its drivers are linked into the binary that
# `versatiles/gdal` reads rasters with (Q19, S3.5).
gdal-src.workspace = true
gdal-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
versatiles.workspace = true
versatiles_container.workspace = true
versatiles_core.workspace = true
versatiles_geometry.workspace = true
versatiles_pipeline.workspace = true
# Verifying a downloaded asset against the digest the manifest pins (G7, Q9). Already in the tree
# through versatiles' own dependencies; named here because this crate calls it directly.
sha2 = "0.10"
# `project.yaml` (Q6). The same crate `versatiles serve --config` reads its own YAML with, so a
# project file and a serve config cannot disagree about what YAML means.
serde_yaml_ng = "0.10"
# Parsing the manifest's download URLs into what `DataReaderHttp` takes. Already in the tree through
# reqwest; named here because this crate builds one directly.
url = "2"

# Type reflection for the generated TypeScript bindings (S0.3). Optional, because the core has no
# other reason to know the binding layer exists — `--features bindings` is only on when generating.
specta = { version = "=2.0.0-rc.25", optional = true, features = ["derive", "serde_json"] }
# Only for the `Any` marker, which is the sole way to say "arbitrary JSON" — specta itself has no
# opaque type. Gated with the rest of the generation tooling.
specta-typescript = { version = "0.0.12", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib"] }

[features]
bindings = ["dep:specta", "dep:specta-typescript"]

[lints.clippy]
all = "warn"

[dev-dependencies]
# Already in the tree via `versatiles/gdal`; used to ask GDAL itself which extensions its drivers
# read, which is the only authority on what the raster import card may claim (S3.5).
gdal = "0.19"
# Already in the tree via the server feature; used to prove the data plane actually serves.
reqwest = { version = "0.13", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
