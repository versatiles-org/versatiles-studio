[workspace]
members = ["crates/studio-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
# 1.85 is edition 2024's floor; 1.94 is what versatiles-rs 4.10 requires.
# This is an application, not a library - we control the build toolchain, so tracking security
# updates matters more than a low MSRV.
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/versatiles-org/versatiles-studio"

[workspace.dependencies]
# versatiles-rs - consumed as a library, never shelled out to (see docs/architecture.md)
versatiles_core = "4.12"
versatiles_container = "4.12"
versatiles_pipeline = "4.12"
versatiles_geometry = "4.12"
# `server` for the data plane, `codegen` for `all_operation_metadata()` (C2), `ssh2` for remote
# sources (A2). Explicitly not `cli` - that pulls clap, env_logger and termimad into a GUI app.
versatiles = { version = "4.12", default-features = false, features = ["server", "codegen", "ssh2", "gdal"] }

# GDAL compiled from source and linked statically, with a deliberately narrow driver set (Q19, Q20).
# `bundled` on `gdal-sys` is what pulls `gdal-src`; the drivers are named on `gdal-src` itself
# because that is the crate that has them. See `.cargo/config.toml` for why pkg-config is blocked.
gdal-sys = { version = "0.12", features = ["bundled"] }
gdal-src = { version = "0.3", default-features = false, features = [
	"driver_gtiff",
	"driver_vrt",
	"driver_png",
	"driver_jpeg",
	"driver_mem",
] }

anyhow = "1"
# Reading a delimited file's header, for E2's column pickers. `versatiles_pipeline` reads CSVs with
# this same crate but does not re-export its reader, and a header line has quoting rules that a
# `split(',')` gets wrong on the first address column that contains a comma.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

# **Pinned fork, and the one thing to remove first.**
#
# `proj-sys` 0.27 requires `libsqlite3-sys >=0.28,<0.36`; `versatiles_container` reaches `^0.38`
# through `r2d2_sqlite`. Both are non-optional and `libsqlite3-sys` declares `links = "sqlite3"`, so
# cargo permits exactly one copy and the graph does not resolve - which is what kept GDAL, and
# therefore E3, out of Studio entirely ([Q19](docs/decisions.md)).
#
# The fork widens that ceiling to any 0.x and changes nothing else. Upstream as
# [georust/proj#261](https://github.com/georust/proj/pull/261); the parallel ask on the other side of
# the conflict is [versatiles-rs#226](https://github.com/versatiles-org/versatiles-rs/issues/226).
#
# Pinned to a commit rather than a branch, so a rebase on the fork cannot silently change what this
# builds. **Drop this block** as soon as either lands and reaches a release - it is the only thing
# here that depends on a repository we control rather than on a published crate.
[patch.crates-io]
proj-sys = { git = "https://github.com/MichaelKreil/proj", rev = "7add234c30862750cdfb8b73bd969f95c199e3ff" }
