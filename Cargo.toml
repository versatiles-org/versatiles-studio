[workspace]
members = ["crates/studio-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
# 1.85 is edition 2024's floor; 1.88 is what a patched serde_with needs (GHSA-7gcf-g7xr-8hxj).
# This is an application, not a library — we control the build toolchain, so tracking security
# updates matters more than a low MSRV.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/versatiles-org/versatiles-studio"

[workspace.dependencies]
# versatiles-rs — consumed as a library, never shelled out to (see docs/architecture.md)
versatiles_core = "4.7"
versatiles_container = "4.7"
versatiles_pipeline = "4.7"
# `server` for the data plane, `codegen` for `all_operation_metadata()` (C2), `ssh2` for remote
# sources (A2). Explicitly not `cli` — that pulls clap, env_logger and termimad into a GUI app.
versatiles = { version = "4.7", default-features = false, features = ["server", "codegen", "ssh2"] }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
